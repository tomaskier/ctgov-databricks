[project]
name = "ctgov-databricks"
version = "0.1.0"
description = "ClinicalTrials.gov ETL pipeline on PySpark + Delta Lake + Databricks Workflows"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctgov_databricks"]
